[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enterprise-ai-assistant"
version = "0.1.0"
description = "Secure enterprise AI assistant: RAG, tool use via MCP, guardrails, audit."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pyjwt[crypto]>=2.9",
  "google-auth>=2.34",
  "requests>=2.32",
  "cryptography>=43,<46",
  "httpx>=0.27",
  "google-genai>=0.8",
  "mcp>=1.9,<2",
  "structlog>=24.4",
  "prometheus-client>=0.20",
  "pypdf>=4.3",
  "python-docx>=1.1",
  "python-multipart>=0.0.9",
  "tenacity>=9.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-pyyaml",
  "types-requests",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "jira_mcp"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM"]
ignore = ["S101", "E501", "B008", "SIM117"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S603", "S607", "S404", "ASYNC220", "ASYNC221", "ASYNC251"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs Postgres with pgvector (docker compose up -d postgres)"]
